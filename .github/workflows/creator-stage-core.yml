name: Creator Core ownership extraction (non-destructive)

on:
  push:
    branches:
      - migration/creator-history-import
    paths:
      - .github/workflows/creator-stage-core.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout history-preserving review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Stage the existing consumer implementation without duplicating publisher code
        shell: bash
        run: |
          set -euo pipefail
          dest='migration/creator-core-extraction-20261023'
          if git ls-remote --exit-code --heads origin "$dest" >/dev/null; then
            echo "refusing to replace existing Creator Core branch" >&2
            exit 1
          fi
          test -f source-import/go.mod
          test -f source-import/core/portable_sources.go
          test -f source-import/cmd/ordax-creator-app/main_windows.go
          test -f docs/evidence/source-history-import.md
          git switch -c "$dest"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for component in go.mod version.json core cmd host platform internal appchannel componentchannel physicalchannel update proof; do
            git mv "source-import/$component" "./$component"
          done
          # Scripts that authorize/produce OS releases are NOT application components.
          # Their exact historical bytes remain reachable in the ancestry, not as an active second owner.
          git rm -r source-import
          python3 - <<'PY'
          from pathlib import Path
          old = "github.com/ordaxsystems/ordax-os/tools/creator"
          new = "github.com/ordaxsystems/ordax-creator"
          paths = list(Path(".").glob("**/*.go")) + [Path("go.mod")]
          modified = 0
          for path in paths:
              if ".git" in path.parts:
                  continue
              contents = path.read_text(encoding="utf-8")
              if old in contents:
                  path.write_text(contents.replace(old, new), encoding="utf-8")
                  modified += 1
          for path in paths:
              if old in path.read_text(encoding="utf-8"):
                  raise SystemExit("stale imported Go module path: " + str(path))
          print("CREATOR_GO_MODULE_REWRITE_FILES=", modified)
          PY
          python3 - <<'PY'
          from pathlib import Path
          source = Path("docs/MIGRATION.md")
          text = source.read_text(encoding="utf-8")
          text = text.replace("| C1 | Exact-commit history extraction from tools/creator/ with Git ancestry, source tree equality and receipt | PENDING |", "| C1 | Exact-commit history extraction from tools/creator/ with Git ancestry, source tree equality and receipt | PASS — import receipt in docs/evidence |")
          text = text.replace("| C2 | File-by-file producer/consumer classification, adoption of OS #2000 without duplicated 17-source inventory | PENDING |", "| C2 | File-by-file producer/consumer classification, adoption of OS #2000 without duplicated 17-source inventory | IN PROGRESS — consumer packages staged, #2000 reconciliation pending |")
          text += "\n## C2 staging receipt (automated source migration)\n\n"
          text += "- Moved Core, cmd, host, platform, internal, appchannel, componentchannel, physicalchannel, update, proof, go.mod and version.json from immutable history into Creator module root.\n"
          text += "- Removed the temporary source-import directory in the branch; files omitted from active Creator stay reachable via source history.\n"
          text += "- Explicitly excluded OS release/promotion root Python scripts and windows publisher scripts pending per-file producer audit.\n"
          text += "- Converted Go import prefix to github.com/ordaxsystems/ordax-creator, without creating a second Core.\n"
          text += "- This branch is NOT cut over; CI tests and canonical contracts integration remain required.\n"
          source.write_text(text, encoding="utf-8")
          PY
          git add -A
          git diff --cached --check
          git commit -m 'refactor(creator): stage single existing Core and consumers under standalone Go module'
          git push origin "HEAD:refs/heads/$dest"
          echo "CREATOR_STAGED_BRANCH=$dest"
          echo "CREATOR_STAGED_SHA=$(git rev-parse HEAD)"
          echo 'PHYSICAL_DEVICE_TOUCHED=NO'
          echo 'PHYSICAL_WRITE_AUTHORIZED=NO'

      - name: Verify imported Go packages compile on Linux (safe; no disk writes)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false

      - name: Compile standalone consumer packages
        shell: bash
        run: |
          set -euo pipefail
          go build ./core ./appchannel ./componentchannel ./physicalchannel ./internal/atomicfile ./update
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/OrdaX-Creator-App.exe" ./cmd/ordax-creator-app
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/ordax-creator.exe" ./cmd/ordax-creator
          sha256sum "$RUNNER_TEMP/OrdaX-Creator-App.exe" "$RUNNER_TEMP/ordax-creator.exe"
          echo 'WINDOWS_CONSUMER_CROSSBUILD=PASS_NON_DESTRUCTIVE'
