name: Creator Windows read-only development candidate

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/creator-windows-candidate.yml
      - cmd/**
      - core/**
      - host/**
      - appchannel/**
      - componentchannel/**
      - physicalchannel/**
      - internal/**
      - update/**
      - go.mod
      - version.json
  pull_request:
    paths:
      - .github/workflows/creator-windows-candidate.yml
      - cmd/**
      - core/**
      - host/**
      - appchannel/**
      - componentchannel/**
      - physicalchannel/**
      - internal/**
      - update/**
      - go.mod
      - version.json

permissions:
  contents: read

jobs:
  windows-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout Creator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Exact Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Build only unprivileged consumer executables twice
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/creator-win-a" "$RUNNER_TEMP/creator-win-b"
          for dir in "$RUNNER_TEMP/creator-win-a" "$RUNNER_TEMP/creator-win-b"; do
            CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags='-s -w -H windowsgui' -o "$dir/OrdaX-Creator-App.exe" ./cmd/ordax-creator-app
            CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags='-s -w' -o "$dir/ordax-creator.exe" ./cmd/ordax-creator
            CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags='-s -w' -o "$dir/ordax-creator-targets.exe" ./cmd/ordax-creator-targets
            CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags='-s -w' -o "$dir/ordax-creator-inspection.exe" ./cmd/ordax-creator-inspection
          done
          for name in OrdaX-Creator-App.exe ordax-creator.exe ordax-creator-targets.exe ordax-creator-inspection.exe; do
            cmp "$RUNNER_TEMP/creator-win-a/$name" "$RUNNER_TEMP/creator-win-b/$name"
          done
          echo 'UNSIGNED_WINDOWS_REPEAT_BUILD_IDENTICAL=PASS'
          echo 'RAW_PHYSICAL_HELPER_INCLUDED=NO'
      - name: Create deterministic unsigned development ZIP with provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/creator
          python3 - <<'PY'
          import hashlib,json,os,pathlib,zipfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'creator-win-a'
          names=['OrdaX-Creator-App.exe','ordax-creator.exe','ordax-creator-targets.exe','ordax-creator-inspection.exe']
          source=os.environ['GITHUB_SHA']
          files={name:{'size':(root/name).stat().st_size,'sha256':hashlib.sha256((root/name).read_bytes()).hexdigest()} for name in names}
          doc={
              '$schema':'prototype-ordax.creator-development-readonly-candidate/1',
              'status':'unsigned-development-review-only',
              'creator_source_commit':source,
              'source_repository':'ordaxsystems/ordax-creator',
              'go_version':'1.27.1',
              'files':files,
              'physical_write_authorized':False,
              'physical_raw_helper_included':False,
              'signed_publication_allowed':False,
              'authenticode_signature_claimed':False,
              'canonical_release_artifacts_included':False,
          }
          content=(json.dumps(doc,indent=2,sort_keys=True)+'\n').encode()
          (root/'provenance.json').write_bytes(content)
          (root/'READ_ME_FIRST.txt').write_text('OrdaX Creator — UNSIGNED development candidate. Non-privileged executables only. No physical USB/disk writing or official Stable release authorization.\n',encoding='utf-8')
          out=pathlib.Path('out/creator/OrdaX-Creator-Development-ReadOnly-Windows-amd64.zip')
          with zipfile.ZipFile(out,'w') as z:
              for path in sorted(root.iterdir()):
                  info=zipfile.ZipInfo(path.name,(1980,1,1,0,0,0))
                  info.compress_type=zipfile.ZIP_DEFLATED
                  info.external_attr=0o100644<<16
                  z.writestr(info,path.read_bytes())
          with zipfile.ZipFile(out) as z:
              expected=set(names)|{'provenance.json','READ_ME_FIRST.txt'}
              assert set(z.namelist())==expected
              assert all('physical-test' not in name.lower() for name in z.namelist())
          print('CANDIDATE_ZIP_SHA256',hashlib.sha256(out.read_bytes()).hexdigest())
          print('CANDIDATE_SOURCE_COMMIT',source)
          print('PHYSICAL_DEVICE_TOUCHED=NO')
          print('PHYSICAL_WRITE_AUTHORIZED=NO')
          PY
      - name: Upload unsigned candidate only
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ordax-creator-UNSIGNED-READONLY-${{ github.sha }}
          path: out/creator/OrdaX-Creator-Development-ReadOnly-Windows-amd64.zip
          if-no-files-found: error
          retention-days: 14


  windows-package-smoke:
    needs: windows-readonly
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - name: Download the exact candidate emitted by this workflow
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: ordax-creator-UNSIGNED-READONLY-${{ github.sha }}
          path: ${{ runner.temp }}/creator-package-input
      - name: Verify extracted ZIP provenance and execute read-only Windows binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $inputRoot = Join-Path $env:RUNNER_TEMP 'creator-package-input'
          $archiveFiles = @(Get-ChildItem -LiteralPath $inputRoot -File -Force)
          $expectedZip = 'OrdaX-Creator-Development-ReadOnly-Windows-amd64.zip'
          if ($archiveFiles.Count -ne 1 -or $archiveFiles[0].Name -cne $expectedZip) {
            throw 'Downloaded artifact contains unexpected files or lacks the exact Creator ZIP'
          }
          $exeNames = @(
            'OrdaX-Creator-App.exe', 'ordax-creator.exe',
            'ordax-creator-targets.exe', 'ordax-creator-inspection.exe'
          )
          $expectedNames = @($exeNames + @('provenance.json', 'READ_ME_FIRST.txt') | Sort-Object)
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archiveFiles[0].FullName)
          try {
            $zipNames = @($zip.Entries | ForEach-Object { $_.FullName } | Sort-Object)
            if (@(Compare-Object -CaseSensitive $expectedNames $zipNames).Count -ne 0) {
              throw 'Development ZIP has missing, duplicate or unexpected files'
            }
          } finally {
            $zip.Dispose()
          }
          $out = Join-Path $env:RUNNER_TEMP 'creator-package-extracted'
          Expand-Archive -LiteralPath $archiveFiles[0].FullName -DestinationPath $out
          $actualNames = @(Get-ChildItem -LiteralPath $out -Force | ForEach-Object { $_.Name } | Sort-Object)
          if (@(Compare-Object -CaseSensitive $expectedNames $actualNames).Count -ne 0) {
            throw 'Extracted package contents diverge from verified ZIP entries'
          }
          $receipt = Get-Content -LiteralPath (Join-Path $out 'provenance.json') -Raw | ConvertFrom-Json
          if ($receipt.'$schema' -cne 'prototype-ordax.creator-development-readonly-candidate/1' -or
              $receipt.status -cne 'unsigned-development-review-only' -or
              $receipt.creator_source_commit -cne $env:GITHUB_SHA -or
              $receipt.source_repository -cne 'ordaxsystems/ordax-creator' -or
              $receipt.go_version -cne '1.27.1' -or
              $receipt.physical_write_authorized -cne $false -or
              $receipt.physical_raw_helper_included -cne $false -or
              $receipt.signed_publication_allowed -cne $false -or
              $receipt.authenticode_signature_claimed -cne $false -or
              $receipt.canonical_release_artifacts_included -cne $false) {
            throw 'Candidate provenance/authority differs from exact unsigned read-only build'
          }
          $actualReceipts = @($receipt.files.PSObject.Properties.Name | Sort-Object)
          if (@(Compare-Object -CaseSensitive ($exeNames | Sort-Object) $actualReceipts).Count -ne 0) {
            throw 'Candidate provenance binary list is not the canonical read-only list'
          }
          foreach ($name in $exeNames) {
            $path = Join-Path $out $name
            $file = Get-Item -LiteralPath $path -Force
            if ($file.PSIsContainer -or ($file.Attributes -band [IO.FileAttributes]::ReparsePoint)) {
              throw "Candidate includes a nonregular or redirected binary: $name"
            }
            $record = $receipt.files.PSObject.Properties[$name].Value
            $sha = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($record.sha256 -cne $sha -or [int64]$record.size -ne [int64]$file.Length -or $file.Length -le 0) {
              throw "Candidate binary digest/size differs from provenance: $name"
            }
          }
          $readme = Get-Content -LiteralPath (Join-Path $out 'READ_ME_FIRST.txt') -Raw
          if ($readme -notmatch 'UNSIGNED' -or $readme -notmatch 'No physical USB') {
            throw 'Missing explicit development-only and non-destructive warning'
          }
          $inspect = Join-Path $out 'ordax-creator-inspection.exe'
          $statusText = (& $inspect status | Out-String)
          if ($LASTEXITCODE -ne 0) { throw 'Packaged read-only inspection failed' }
          $status = $statusText | ConvertFrom-Json
          if ($status.mode -cne 'development-inspection-only' -or
              $status.raw_backend_linked -ne $false -or
              $status.build.physical_write_authorized -ne $false -or
              $status.build.ready -ne $false) {
            throw 'Packaged inspection unexpectedly has physical authority'
          }
          # The actual packaged GUI constructs its Win32 controls once with
          # services disabled. Never enumerate USB, connect to the network,
          # launch an updater, request UAC or enter the disk writer.
          $app = Join-Path $out 'OrdaX-Creator-App.exe'
          $process = Start-Process -FilePath $app -ArgumentList '--offline-package-smoke' -PassThru
          try {
            if (-not $process.WaitForExit(15000)) {
              throw 'Packaged Win32 no-services UI smoke timed out'
            }
            if ($process.ExitCode -ne 0) {
              throw "Packaged Win32 no-services UI smoke failed: exit=$($process.ExitCode)"
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
            $process.Dispose()
          }
          Write-Output 'CREATOR_PACKAGE_SHA256_AND_PROVENANCE=PASS'
          Write-Output 'PACKAGED_WINDOWS_GUI_NO_SERVICES=PASS'
          Write-Output 'PACKAGED_INSPECTION_READ_ONLY=PASS'
          Write-Output 'PHYSICAL_DEVICE_ENUMERATED=NO'
          Write-Output 'PHYSICAL_WRITE_AUTHORIZED=NO'
