name: Creator standalone CI (non-destructive)

on:
  push:
    branches:
      - migration/creator-core-extraction-20261023
    paths:
      - .github/workflows/creator-standalone-ci.yml
      - core/**
      - cmd/**
      - host/**
      - appchannel/**
      - componentchannel/**
      - physicalchannel/**
      - internal/**
      - update/**
      - go.mod
  pull_request:
    paths:
      - .github/workflows/creator-standalone-ci.yml
      - core/**
      - cmd/**
      - host/**
      - appchannel/**
      - componentchannel/**
      - physicalchannel/**
      - internal/**
      - update/**
      - go.mod

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout Creator only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup exact Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Assert one executable Core and no old imports
        shell: bash
        run: |
          set -euo pipefail
          test -f go.mod
          test -f core/portable_sources.go
          test -f cmd/ordax-creator-app/main_windows.go
          test ! -e source-import
          test ! -e authorize_physical_write.py
          test ! -e physical_promotion.py
          if grep -R -l 'github.com/ordaxsystems/ordax-os/tools/creator' --include='*.go' ./; then
            echo 'stale OS Creator module references remain' >&2
            exit 1
          fi
          echo 'CREATOR_SINGLE_MODULE_SOURCE=PASS'
          echo 'PHYSICAL_DEVICE_TOUCHED=NO'
      - name: Unit tests and Go vet (no media access)
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go vet ./...
      - name: Windows GUI and unprivileged CLI cross-build
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags='-s -w' -o "$RUNNER_TEMP/OrdaX-Creator-App.exe" ./cmd/ordax-creator-app
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags='-s -w' -o "$RUNNER_TEMP/ordax-creator.exe" ./cmd/ordax-creator
          sha256sum "$RUNNER_TEMP/OrdaX-Creator-App.exe" "$RUNNER_TEMP/ordax-creator.exe"
          echo 'WINDOWS_GUI_CROSSBUILD=PASS'
          echo 'PHYSICAL_WRITE_AUTHORIZED=NO'
      - name: Windows RAW backend isolation contract (compile only)
        shell: bash
        run: |
          set -euo pipefail
          base="$(CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go list -f '{{range .GoFiles}}{{println .}}{{end}}' ./host/windows)"
          gated="$(CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go list -tags ordax_raw_backend -f '{{range .GoFiles}}{{println .}}{{end}}' ./host/windows)"
          for file in raw_handle_write_windows.go volume_lease_windows.go elevation_windows.go raw_runtime_windows.go; do
            if grep -qx "$file" <<<"$base"; then echo "raw backend leaked into normal build: $file" >&2; exit 1; fi
            if ! grep -qx "$file" <<<"$gated"; then echo "tagged raw backend missing: $file" >&2; exit 1; fi
          done
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go test -c -tags ordax_raw_backend -o "$RUNNER_TEMP/ordax-raw-backend.test.exe" ./host/windows
          rm -f "$RUNNER_TEMP/ordax-raw-backend.test.exe"
          echo 'CREATOR_RAW_BACKEND_GATED=PASS'
